<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StudySpace">
<title>StudySpace — Notes & Planner</title>
<style>
:root{--bg:#f4f5f8;--panel:#fff;--ink:#202536;--muted:#778096;--line:#e7e9ef;--accent:#5965d8;--soft:#eef0ff;--green:#25866b;--shadow:0 8px 28px #2226380b;--lesson-bg:#f8f9fc;--lesson-border:#d1d6e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8790ff;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:265px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;max-height:100vh}
.brand{font-size:19px;font-weight:800;letter-spacing:-.6px;padding:0 9px}.brand span{color:var(--accent)}.nav{display:grid;gap:5px}.nav button,.side-action{background:transparent;text-align:left;padding:9px 12px;border-radius:9px;color:#606a7e}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent);font-weight:650}.side-head{display:flex;justify-content:space-between;align-items:center;padding:0 9px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:1px;text-transform:uppercase}.tiny{background:var(--soft);color:var(--accent);border-radius:7px;padding:3px 8px;font-weight:700}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}.side-action{border:1px solid var(--line);text-align:center}
.sb-tree{display:grid;gap:2px}.sb-subject{padding:7px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px;color:#505a6e}.sb-subject:hover,.sb-subject.sel{background:#f3f4fa}.sb-subject.sel{font-weight:650;color:var(--accent)}.sb-subject .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}.sb-subject .caret{margin-left:auto;font-size:10px;color:#9aa1af;width:16px;text-align:center}
.sb-node{padding-left:14px}.sb-row{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;font-size:12px;color:#5b6478;cursor:pointer}.sb-row:hover{background:#f6f7fb}.sb-row .caret{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#9aa1af;flex:none}.sb-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb-row.sel{background:var(--soft);color:var(--accent);font-weight:650}
.sb-note{padding-left:26px;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;font-size:12px;color:#5b6478;cursor:pointer}.sb-note:hover{background:#f6f7fb}.sb-note.sel{background:var(--soft);color:var(--accent);font-weight:650}.sb-note .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;padding:20px clamp(18px,4vw,52px)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.top-actions{display:flex;gap:9px}.btn{padding:9px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);color:#4e586d;font-weight:600}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.small{padding:6px 10px;font-size:12px}.btn:hover{filter:brightness(.97)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}.panel h2{font-size:15px;margin:0 0 15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat strong{font-size:24px;display:block;letter-spacing:-.6px}.stat span{color:var(--muted);font-size:12px}.muted{color:var(--muted)}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f5}.task:last-child{border:0}.task input{margin-top:4px;accent-color:var(--accent)}.task-text{flex:1}.task.done .task-text{text-decoration:line-through;color:#a2a8b4}.task small{display:block;color:var(--muted);margin-top:2px}.task .delete{background:transparent;color:#a1a7b3;padding:0 4px}.empty{color:#9aa1af;text-align:center;padding:24px 8px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month-label{font-weight:700}.cal-nav{display:flex;gap:5px}.cal-nav button{background:#f4f5f9;border-radius:7px;padding:5px 9px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday{text-align:center;color:#9299a8;font-size:11px;padding:5px 0}.day{min-height:35px;border-radius:8px;background:transparent;color:#515b6e;position:relative}.day:hover{background:#f1f2f8}.day.other{color:#c1c5ce}.day.today{background:var(--soft);color:var(--accent);font-weight:800}.day.selected{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--soft)}.day.has-task:after{content:"";position:absolute;bottom:4px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--green)}.day.has-done:after{background:#b8bdc9}.day.has-lessons:before{content:"";position:absolute;bottom:4px;left:calc(50% - 8px);width:4px;height:4px;border-radius:50%;background:var(--accent)}.day.has-lessons.has-task:before,.day.has-lessons.has-task:after{left:calc(50% - 6px)}.day.has-lessons.has-task:after{left:calc(50% + 2px)}
.section{display:none}.section.active{display:block}
/* Timetable & Tasks CSS */
.timetable{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}.lesson-row{background:var(--lesson-bg);border:1px solid var(--lesson-border);border-radius:10px;padding:12px 15px;display:flex;justify-content:space-between;align-items:flex-start}.lesson-info strong{display:block;font-size:14px;color:var(--ink)}.lesson-info span{font-size:12px;color:var(--muted)}.lesson-actions button{background:var(--soft);color:var(--accent);border:0;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:600}
.note-ws{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.tree-pane{background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:70vh;overflow-y:auto}
.tree-node{margin:0}.tree-row{display:flex;align-items:center;gap:4px;padding:6px 6px;border-radius:7px;font-size:13px;color:#5b6478;cursor:pointer;position:relative;user-select:none}.tree-row:hover{background:#eff1f8}.tree-row.sel{background:var(--soft);color:var(--accent);font-weight:650}.tree-row .caret{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#9aa1af;flex:none}.tree-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-row .addsub,.tree-row .deltopic,.tree-row .mvup,.tree-row .mvdn{background:transparent;color:#a1a7b3;font-size:13px;padding:0 2px;line-height:1;display:none}.tree-row:hover .addsub,.tree-row:hover .deltopic,.tree-row:hover .mvup,.tree-row:hover .mvdn,.tree-row.sel .addsub,.tree-row.sel .deltopic,.tree-row.sel .mvup,.tree-row.sel .mvdn{display:inline}.tree-row .addsub:hover{color:var(--accent)}.tree-row .deltopic:hover{color:#e05555}.tree-row .mvup:hover,.tree-row .mvdn:hover{color:var(--accent)}.tree-children{margin-left:14px;border-left:1px dashed #e1e4ec;padding-left:4px}
.note-editor{min-width:0}.editor-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.note-title-input{flex:1;font-size:20px;font-weight:700;border:0;border-bottom:1px solid transparent;padding:6px 2px;outline:none;background:transparent;color:var(--ink)}.note-title-input:focus{border-color:var(--line)}.dirty-dots{font-size:16px;letter-spacing:1px;color:#c7ccd6;opacity:0;transition:opacity .2s;flex:none}.dirty-dots.show{opacity:1}.editor{width:100%;min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:15px;color:var(--ink);line-height:1.7;background:#fff}
.editor-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.editor-foot .meta{font-size:12px;color:var(--muted)}
.note-list{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.note-list h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}.note-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#4e586d}.note-item:hover{background:#f5f6fb}.note-item.sel{background:var(--soft);color:var(--accent);font-weight:650}.note-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-item .del{background:transparent;color:#b8bdc9;padding:0 4px}.note-item .del:hover{color:#e05555}
.add-wrap{position:relative;display:inline-block}.add-menu{position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:190px;max-height:260px;overflow-y:auto;z-index:6;display:none}.add-menu.show{display:block}.add-menu button{display:block;width:100%;text-align:left;padding:10px 14px;background:transparent;color:var(--ink);font-size:13px}.add-menu button:hover{background:var(--soft);color:var(--accent)}
.fullscreen-note{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;padding:18px}.fullscreen-note.show{display:flex}.fs-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.fs-head .note-title-input{font-size:24px}.fs-editor{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:16px;line-height:1.7;resize:none;color:var(--ink)}.fs-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.modal-backdrop{position:fixed;inset:0;background:#171b2a66;display:none;align-items:center;justify-content:center;padding:18px;z-index:7}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:15px;padding:22px;width:min(420px,100%);box-shadow:0 20px 70px #10132244}.modal h2{margin:0 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--ink)}.field-label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.mobile-menu{display:none}.main-click-overlay{position:fixed;inset:0;z-index:3;display:none}.main-click-overlay.active{display:block}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:4;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.layout{grid-template-columns:1fr}.right-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.main{padding:16px 15px}.topbar{margin-bottom:14px}.sidebar.open ~ .main-click-overlay{display:block}.note-ws{grid-template-columns:1fr}.tree-pane{max-height:40vh}}
@media(max-width:540px){.right-col{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:20px}.top-actions .btn:not(.primary){display:none}.panel{padding:15px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">Study<span>Space</span></div>
  <nav class="nav">
    <button class="active" data-view="home">⌂ &nbsp; Overview</button>
    <button data-view="planner">✓ &nbsp; To-do list</button>
  </nav>
  <div>
    <div class="side-head"><span>Subjects</span><button class="tiny" id="addSubject">＋</button></div>
    <div class="sb-tree" id="sidebarTree"></div>
  </div>
  <div class="sidebar-bottom">
    <button class="side-action" id="syncPanelBtn" style="color:var(--green);border-color:#cfe8df">⇅ &nbsp; Sync & settings</button>
    <button class="side-action" id="termDatesBtn">📅 &nbsp; Term Dates</button>
    <button class="side-action" id="exportBtn">↓ &nbsp; Export backup</button>
    <button class="side-action" id="importBtn">↑ &nbsp; Import backup</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</aside>
<div class="main-click-overlay" id="mainOverlay"></div>
<main class="main" id="mainContent">
  <header class="topbar">
    <button class="btn mobile-menu" id="menuBtn">☰</button>
    <div class="top-actions">
      <button class="btn" id="quickTask">＋ Task</button>
      <div class="add-wrap"><button class="btn primary" id="quickNote">＋ New note</button><div class="add-menu" id="quickNoteMenu"></div></div>
    </div>
  </header>

  <section class="section active" id="homeView">
    <div class="stats"><div class="stat"><strong id="statSubjects">0</strong><span>Subjects</span></div><div class="stat"><strong id="statNotes">0</strong><span>Notes saved</span></div><div class="stat"><strong id="statTasks">0</strong><span>Tasks remaining</span></div></div>
    <div class="layout"><div class="panel"><h2>Next 3 tasks</h2><div id="todayTasks"></div><button class="btn" style="margin-top:12px" onclick="showView('planner')">View all tasks →</button></div><div class="right-col"><div class="panel"><div class="calendar-head"><div class="month-label" id="monthLabel"></div><div class="cal-nav"><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div><div class="calendar" id="calendar"></div></div><div class="panel"><h2>Recently edited</h2><div id="recentNotes"></div></div></div></div>
  </section>

  <section class="section" id="notesView"><div class="panel" style="padding:16px"><div class="note-ws"><div class="tree-pane" id="treePane"></div><div class="note-editor" id="noteEditorPane"></div></div></div></section>

  <section class="section" id="plannerView"><div class="layout"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>My tasks</h2><button class="btn primary" id="addTask">＋ Add task</button></div><div id="allTasks"></div></div><div class="panel"><h2>Plan a task</h2><p class="muted">Choose a date in the calendar on Overview, or add a task with a due date.</p><button class="btn" onclick="showView('home')">Open calendar →</button></div></div></section>
</main>
</div>

<div class="fullscreen-note" id="fsNote">
  <div class="fs-head"><input class="note-title-input" id="fsTitle" placeholder="Untitled note"><span class="dirty-dots" id="fsDirty">•••</span></div>
  <textarea class="fs-editor" id="fsBody" placeholder="Start writing..."></textarea>
  <div class="fs-foot"><div class="meta muted" id="fsMeta" style="font-size:12px"></div><div style="display:flex;gap:6px"><button class="btn" id="fsClose">⤡ Close</button><button class="btn primary" id="fsSave">Save note</button></div></div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">Add</h2><div id="modalBody"></div><div class="modal-actions"><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalSave">Save</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Math.random().toString(36).slice(2,10);

// --- TIMETABLE DATA ---
const TIMETABLE = {
  1: { // Week 1
    1: [{p:1,s:'Economics',r:'A16',t:'Miss A McLean'},{p:2,s:'Media Studies',r:'B14',t:'Mrs A Hewitt'},{p:3,s:'Assembly',r:'',t:'Mr P Lewis'},{p:4,s:'Directed Learning',r:'',t:''},{p:5,s:'Sociology',r:'M10',t:'Miss G Banton'}],
    2: [{p:1,s:'Economics',r:'A16',t:'Miss A McLean'},{p:2,s:'Directed Learning',r:'',t:''},{p:3,s:'Media Studies',r:'B15',t:'Mrs A Hewitt'},{p:4,s:'PSHE',r:'M2',t:'Ms M Flynn'}],
    3: [{p:1,s:'Sociology',r:'M9',t:'Mr G Cresswell'},{p:2,s:'Directed Learning',r:'',t:''},{p:3,s:'Directed Learning',r:'',t:''},{p:4,s:'Media Studies',r:'B15',t:'Miss C Seery'},{p:5,s:'Sociology',r:'M9',t:'Mr G Cresswell'}],
    4: [{p:1,s:'Directed Learning',r:'',t:''},{p:2,s:'Directed Learning',r:'',t:''},{p:3,s:'Economics',r:'A16',t:'Miss A McLean'},{p:4,s:'Economics',r:'A16',t:'Miss A McLean'},{p:5,s:'Directed Learning',r:'',t:''}],
    5: [{p:1,s:'Media Studies',r:'B14',t:'Miss C Seery'},{p:2,s:'Sociology',r:'M5',t:'Miss N Hellen'},{p:3,s:'Economics',r:'A16',t:'Miss A McLean'},{p:4,s:'Directed Learning',r:'',t:''}]
  },
  2: { // Week 2
    1: [{p:1,s:'Economics',r:'A16',t:'Miss A McLean'},{p:2,s:'Sociology',r:'M10',t:'Miss G Banton'},{p:3,s:'Sociology',r:'M9',t:'Mr G Cresswell'},{p:4,s:'Media Studies',r:'B14',t:'Mrs A Hewitt'},{p:5,s:'Directed Learning',r:''}],
    2: [{p:1,s:'Economics',r:'A16',t:'Miss A McLean'},{p:2,s:'Sociology',r:'M10',t:'Miss G Banton'},{p:3,s:'Sociology',r:'M10',t:'Miss G Banton'},{p:4,s:'Directed Learning',r:''},{p:5,s:'Directed Learning',r:''}],
    3: [{p:1,s:'Media Studies',r:'B14',t:'Miss C Seery'},{p:2,s:'Directed Learning',r:''},{p:3,s:'Economics',r:'A16',t:'Miss A McLean'},{p:4,s:'Sociology',r:'M9',t:'Mr G Cresswell'},{p:5,s:'Media Studies',r:'B15',t:'Mrs A Hewitt'}],
    4: [{p:1,s:'Directed Learning',r:''},{p:2,s:'Directed Learning',r:''},{p:3,s:'Economics',r:'A16',t:'Miss A McLean'},{p:4,s:'Media Studies',r:'B14',t:'Miss C Seery'},{p:5,s:'Sociology',r:'M9',t:'Mr G Cresswell'}],
    5: [{p:1,s:'Economics',r:'A16',t:'Miss A McLean'},{p:2,s:'Sociology',r:'M9',t:'Mr G Cresswell'},{p:3,s:'Directed Learning',r:''},{p:4,s:'Media Studies',r:'B15',t:'Mrs A Hewitt'},{p:5,s:'Economics',r:'A16',t:'Miss A McLean'}]
  }
};

const defaults={
  subjects:[
    {id:'econ',name:'Economics',color:'#e2a34b',topics:[{id:'t1',name:'Theme 1',children:[]}]},
    {id:'soc',name:'Sociology',color:'#7c83df',topics:[{id:'t2',name:'Theme 1',children:[]}]},
    {id:'media',name:'Media Studies',color:'#49a88d',topics:[{id:'t3',name:'Theme 1',children:[]}]}
  ],
  notes:[],tasks:[],
  settings:{ week2Start: nextMondayISO() }
};

let data;try{data=JSON.parse(localStorage.getItem('studyspace_data'))||defaults}catch{data=defaults}
if(!data.settings) data.settings = defaults.settings;
(function migrate(){data.subjects.forEach(s=>{if(!Array.isArray(s.topics))s.topics=[];s.topics.forEach(function fix(t){if(!Array.isArray(t.children))t.children=(t.subtopics||[]).map(st=>({id:st.id||uid(),name:st.name,children:[]}));t.children.forEach(fix)})});data.notes.forEach(n=>{if(!n.path)n.path=n.subtopicId?[n.topicId,n.subtopicId]:(n.topicId?[n.topicId]:[])})})();

let currentSubject=data.subjects[0]?.id||null;
let currentPath=[],currentNote=null,expanded=new Set(),expandedSubjects=new Set(),dirty=false;
let calDate=new Date(),selectedDate=todayISO(),modalAction=null;

function nextMondayISO(){let d=new Date();let day=d.getDay();let diff=day===1?7:(8-day)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return d.toISOString().split('T')[0]}

function save(){localStorage.setItem('studyspace_data',JSON.stringify(data));renderAll()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function showView(v){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(v+'View').classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('sidebar').classList.remove('open');if(v==='notes')renderNotes();if(v==='planner')renderTasks()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
$('menuBtn').onclick=(e)=>{e.stopPropagation();$('sidebar').classList.toggle('open')};
$('mainOverlay').onclick=()=>$('sidebar').classList.remove('open');

/* ---------- TIMETABLE LOGIC ---------- */
function getWeekNumber(isoDate){
  const start = new Date(data.settings.week2Start+'T12:00:00');
  const target = new Date(isoDate+'T12:00:00');
  const diffDays = Math.round((target - start) / (1000*60*60*24));
  if(diffDays < 0) return 1; // Before start, assume Week 1
  const weeksPassed = Math.floor(diffDays / 7);
  return (weeksPassed % 2 === 0) ? 2 : 1; 
}

function getLessonsForDate(isoDate){
  const d = new Date(isoDate+'T12:00:00');
  const dayOfWeek = d.getDay(); 
  if(dayOfWeek === 0 || dayOfWeek === 6) return []; // Weekend
  
  const weekNum = getWeekNumber(isoDate);
  const timetableDay = dayOfWeek === 6 ? 6 : dayOfWeek; // Mon=1...Fri=5
  return TIMETABLE[weekNum][timetableDay] || [];
}

/* ---------- SIDEBAR ---------- */
function renderSidebarTree(){
  const host=$('sidebarTree');
  if(!data.subjects.length){host.innerHTML='<div class="empty">Add your first subject</div>';return}
  let html='';
  data.subjects.forEach(s=>{
    const subjOpen=expandedSubjects.has(s.id);
    html+=`<div class="sb-subject ${s.id===currentSubject?'sel':''}" data-subj="${s.id}"><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}<span class="caret" data-subjcaret="${s.id}">${subjOpen?'▾':'▸'}</span></div>`;
    if(subjOpen) html+=renderSbTopics(s,s.topics);
  });
  host.innerHTML=html;
  host.querySelectorAll('[data-subj]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();currentSubject=el.dataset.subj;currentPath=[];currentNote=null;dirty=false;showView('notes');renderAll()});
  host.querySelectorAll('[data-subjcaret]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const id=el.dataset.subjcaret;if(expandedSubjects.has(id))expandedSubjects.delete(id);else expandedSubjects.add(id);renderSidebarTree()});
  host.querySelectorAll('[data-sbnav]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();currentSubject=el.dataset.subj;currentPath=JSON.parse(el.dataset.sbnav);currentNote=null;dirty=false;showView('notes');renderAll()});
  host.querySelectorAll('[data-sbcaret]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const id=el.dataset.sbcaret;if(expanded.has(id))expanded.delete(id);else expanded.add(id);renderSidebarTree()});
  host.querySelectorAll('[data-sbnote]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const n=data.notes.find(x=>x.id===el.dataset.sbnote);if(!n)return;currentSubject=n.subject;currentPath=[...n.path];currentNote=n.id;dirty=false;showView('notes');renderAll()});
}
function renderSbTopics(subject,topics){
  if(!topics.length)return '';
  let out='<div class="sb-node">';
  topics.forEach(t=>{
    const isOpen=expanded.has(t.id);
    const path=getPath(subject,t.id);
    out+=`<div class="sb-row" data-sbnav='${JSON.stringify(path)}' data-subj="${subject.id}"><span class="caret" data-sbcaret="${t.id}">${t.children.length||noteCount(subject,path)?(isOpen?'▾':'▸'):'·'}</span><span class="nm">${esc(t.name)}</span></div>`;
    if(isOpen){
      if(t.children.length)out+=renderSbTopics(subject,t.children);
      data.notes.filter(n=>n.subject===subject.id&&JSON.stringify(n.path)===JSON.stringify(path)).forEach(n=>{
        out+=`<div class="sb-note" data-sbnote="${n.id}"><span class="nm">${esc(n.title||'Untitled note')}</span></div>`;
      });
    }
  });
  out+='</div>';
  return out;
}
function noteCount(subject,path){return data.notes.filter(n=>n.subject===subject.id&&JSON.stringify(n.path)===JSON.stringify(path)).length}

/* ---------- NOTES ---------- */
function findTopic(topics,path){let list=topics,node=null;for(const id of path){node=list.find(t=>t.id===id);if(!node)return null;list=node.children}return node}
function topicName(subject,path){const t=findTopic(subject.topics,path);return t?t.name:''}
function deleteTopicByPath(subject,path){if(!path.length)return;const parentPath=path.slice(0,-1),lastId=path[path.length-1];if(!parentPath.length){subject.topics=subject.topics.filter(t=>t.id!==lastId)}else{const p=findTopic(subject.topics,parentPath);if(p)p.children=p.children.filter(t=>t.id!==lastId)}}
function getPath(subject,id,list=null,acc=[]){list=list||subject.topics;for(const t of list){if(t.id===id)return [...acc,t.id];const r=getPath(subject,id,t.children||[],[...acc,t.id]);if(r)return r}return null}
function siblingsOf(subject,path){const parentPath=path.slice(0,-1);if(!parentPath.length)return subject.topics;const p=findTopic(subject.topics,parentPath);return p?p.children:[]}
function moveTopic(subject,path,dir){
  const sibs=siblingsOf(subject,path), id=path[path.length-1], i=sibs.findIndex(t=>t.id===id);
  if(i<0)return; const j=i+dir; if(j<0||j>=sibs.length)return;
  [sibs[i],sibs[j]]=[sibs[j],sibs[i]];
}

function renderNotes(){
  const s=data.subjects.find(x=>x.id===currentSubject);
  if(!s){$('treePane').innerHTML='<div class="empty">Add a subject first</div>';$('noteEditorPane').innerHTML='';return}
  currentPath.forEach(id=>expanded.add(id));
  if(currentPath.length&&!findTopic(s.topics,currentPath)){currentPath=[];currentNote=null}
  $('treePane').innerHTML=renderTree(s,s.topics,[]);
  document.querySelectorAll('[data-topen]').forEach(el=>el.onclick=(ev)=>{
    if(ev.target.closest('[data-deltopic]')||ev.target.closest('[data-addsub]')||ev.target.closest('[data-tcaret]')||ev.target.closest('[data-mv]'))return;
    const path=JSON.parse(el.dataset.topen);
    if(JSON.stringify(path)===JSON.stringify(currentPath)){
      const id=path[path.length-1];
      if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
    } else {
      currentPath=path; currentNote=null; dirty=false;
      path.forEach(id=>expanded.add(id));
    }
    renderNotes();
  });
  document.querySelectorAll('[data-tcaret]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const id=el.dataset.tcaret;if(expanded.has(id))expanded.delete(id);else expanded.add(id);renderNotes()});
  document.querySelectorAll('[data-addsub]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();currentPath=JSON.parse(el.dataset.addsub);addSubtopicHere()});
  document.querySelectorAll('[data-deltopic]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const path=JSON.parse(el.dataset.deltopic);if(!confirm('Delete this topic and everything inside it?'))return;deleteTopicByPath(s,path);data.notes=data.notes.filter(n=>!(n.subject===s.id&&n.path.slice(0,path.length).join()===path.join()));if(currentPath.slice(0,path.length).join()===path.join()){currentPath=path.slice(0,-1);currentNote=null}save()});
  document.querySelectorAll('[data-mv]').forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();const path=JSON.parse(el.dataset.mv);moveTopic(s,path,el.dataset.dir==='up'?-1:1);save()});
  renderNoteEditor(s);
}
function renderTree(s,topics,parentPath){
  if(!topics.length)return '<div class="empty" style="padding:10px">No topics yet. Tap ＋ Add below.</div>';
  let out='';
  topics.forEach((t,idx)=>{
    const path=[...parentPath,t.id];
    const sel=JSON.stringify(path)===JSON.stringify(currentPath);
    const open=expanded.has(t.id);
    const canUp=idx>0, canDown=idx<topics.length-1;
    out+=`<div class="tree-node"><div class="tree-row ${sel?'sel':''}" data-topen='${JSON.stringify(path)}'><span class="caret" data-tcaret="${t.id}">${t.children.length||noteCount(s,path)?(open?'▾':'▸'):'·'}</span><span class="nm">${esc(t.name)}</span>${canUp?`<button class="mvup" data-mv='${JSON.stringify(path)}' data-dir="up" title="Move up">▲</button>`:''}${canDown?`<button class="mvdn" data-mv='${JSON.stringify(path)}' data-dir="down" title="Move down">▼</button>`:''}<button class="addsub" data-addsub='${JSON.stringify(path)}' title="Add subtopic">＋</button><button class="deltopic" data-deltopic='${JSON.stringify(path)}' title="Delete">×</button></div>${open&&t.children.length?`<div class="tree-children">${renderTree(s,t.children,path)}</div>`:''}${open?renderNoteChildren(s,path):''}</div>`;
  });
  return out;
}
function renderNoteChildren(s,path){
  const ns=data.notes.filter(n=>n.subject===s.id&&JSON.stringify(n.path)===JSON.stringify(path));
  if(!ns.length)return '';
  return ns.map(n=>`<div class="tree-row" style="padding-left:22px;font-size:12px" data-open-note="${n.id}"><span class="nm">${esc(n.title||'Untitled note')}</span></div>`).join('');
}
function renderNoteEditor(s){
  const host=$('noteEditorPane');
  const topicLabel=currentPath.length?topicName(s,currentPath):'(no topic selected)';
  const list=data.notes.filter(n=>n.subject===s.id&&JSON.stringify(n.path)===JSON.stringify(currentPath)).sort((a,b)=>b.updated-a.updated);
  let note=data.notes.find(n=>n.id===currentNote);
  if(note&&!(note.subject===s.id&&JSON.stringify(note.path)===JSON.stringify(currentPath)))note=null;
  host.innerHTML=`
    <div class="editor-head"><div style="flex:1"><div class="muted" style="font-size:12px">${currentPath.length?esc(topicLabel):'Select a topic on the left, or ＋ Add below'}</div></div>
      <div class="add-wrap"><button class="btn primary small" id="addBtn">＋ Add</button><div class="add-menu" id="addMenu"><button data-add="topic">New topic (top level)</button><button data-add="subtopic">New subtopic here</button><button data-add="note">New note here</button></div></div>
    </div>
    ${note?`
      <div class="editor-head"><input class="note-title-input" id="noteTitle" value="${esc(note.title)}" placeholder="Untitled note"><span class="dirty-dots ${dirty?'show':''}" id="dirtyDots">•••</span><button class="btn small" id="fsBtn" title="Fullscreen">⤢</button></div>
      <textarea class="editor" id="noteBody" placeholder="Start writing...">${esc(note.body)}</textarea>
      <div class="editor-foot"><div class="meta">${note.updated?'Updated '+new Date(note.updated).toLocaleString():'New note'}</div><div style="display:flex;gap:6px"><button class="btn" id="deleteNote">Delete</button><button class="btn primary" id="saveNote">Save note</button></div></div>
      <div class="note-list"><h3>Notes in this ${currentPath.length>1?'subtopic':'topic'}</h3>${list.length?list.map(n=>`<div class="note-item ${n.id===currentNote?'sel':''}" data-open-note="${n.id}"><span class="nm">${esc(n.title||'Untitled note')}</span><button class="del" data-del-note="${n.id}">×</button></div>`).join(''):'<div class="muted" style="font-size:12px;padding:6px 0">No other notes yet.</div>'}</div>
    `:`
      <div class="empty">${currentPath.length?'No note selected.':'Pick a topic first.'}</div>
      ${currentPath.length?'<button class="btn primary" id="createNote">＋ Write a note here</button>':''}
      ${list.length?`<div class="note-list"><h3>Notes in this topic</h3>${list.map(n=>`<div class="note-item ${n.id===currentNote?'sel':''}" data-open-note="${n.id}"><span class="nm">${esc(n.title||'Untitled note')}</span><button class="del" data-del-note="${n.id}">×</button></div>`).join('')}</div>`:''}
    `}`;
  const addBtn=$('addBtn'),addMenu=$('addMenu');
  addBtn.onclick=(e)=>{e.stopPropagation();addMenu.classList.toggle('show')};
  addMenu.querySelectorAll('[data-add]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();addMenu.classList.remove('show');if(b.dataset.add==='topic')addTopic();else if(b.dataset.add==='subtopic')addSubtopicHere();else addNoteHere()});
  if($('noteTitle')){$('noteTitle').oninput=()=>markDirty(true);$('noteBody').oninput=()=>markDirty(true)}
  if($('saveNote'))$('saveNote').onclick=()=>saveNote();
  if($('fsBtn'))$('fsBtn').onclick=()=>openFullscreen(note);
  if($('deleteNote'))$('deleteNote').onclick=()=>{if(!confirm('Delete this note?'))return;data.notes=data.notes.filter(n=>n.id!==currentNote);currentNote=null;dirty=false;save()};
  if($('createNote'))$('createNote').onclick=()=>addNoteHere();
  document.querySelectorAll('[data-open-note]').forEach(el=>el.onclick=(e)=>{
    if(e.target.closest('[data-del-note]'))return;
    currentNote=el.dataset.openNote;dirty=false;renderNotes();
  });
  document.querySelectorAll('[data-del-note]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    if(!confirm('Delete this note?'))return;
    data.notes=data.notes.filter(n=>n.id!==el.dataset.delNote);
    if(currentNote===el.dataset.delNote)currentNote=null;
    save();
  });
}
function markDirty(v){dirty=v;const d=$('dirtyDots');if(d)d.classList.toggle('show',v)}

function saveNote(){
  if(!currentSubject||!currentPath.length){alert('Pick a topic first.');return}
  let note=data.notes.find(n=>n.id===currentNote);
  const title=$('noteTitle').value, body=$('noteBody').value;
  if(!note){note={id:uid(),subject:currentSubject,path:[...currentPath],title,body,updated:Date.now()};data.notes.push(note);currentNote=note.id}
  else{note.title=title;note.body=body;note.updated=Date.now()}
  markDirty(false);
  save();
}
function addNoteHere(){
  if(!currentSubject)return;
  if(!currentPath.length){alert('Select or create a topic first.');return}
  const note={id:uid(),subject:currentSubject,path:[...currentPath],title:'',body:'',updated:Date.now()};
  data.notes.push(note);currentNote=note.id;dirty=false;
  save();
  setTimeout(()=>{$('noteTitle')?.focus();markDirty(false)},0);
}
function addTopic(){
  if(!currentSubject)return;
  openModal('New topic (top level)',`<label class="field-label">Topic name</label><input class="field" id="topicName" placeholder="e.g. Theme 3">`,()=>{
    const v=$('topicName').value.trim(), s=data.subjects.find(x=>x.id===currentSubject);
    if(v&&s){const t={id:uid(),name:v,children:[]};s.topics.push(t);currentPath=[t.id];expanded.add(t.id);currentNote=null;dirty=false;save()}
  });
}
function addSubtopicHere(){
  if(!currentSubject)return;
  if(!currentPath.length){addTopic();return}
  const s=data.subjects.find(x=>x.id===currentSubject), parent=findTopic(s.topics,currentPath);
  if(!parent){addTopic();return}
  openModal('New subtopic inside "'+parent.name+'"',`<label class="field-label">Subtopic name</label><input class="field" id="subName" placeholder="e.g. Business growth">`,()=>{
    const v=$('subName').value.trim();
    if(v){const t={id:uid(),name:v,children:[]};parent.children.push(t);currentPath=[...currentPath,t.id];expanded.add(t.id);currentNote=null;dirty=false;save()}
  });
}

/* ---------- FULLSCREEN NOTE ---------- */
let fsNoteId=null;
function openFullscreen(note){
  if(!note)return;
  fsNoteId=note.id;
  $('fsTitle').value=note.title||'';
  $('fsBody').value=note.body||'';
  $('fsMeta').textContent=note.updated?'Updated '+new Date(note.updated).toLocaleString():'New note';
  $('fsDirty').classList.remove('show');
  $('fsNote').classList.add('show');
  setTimeout(()=>$('fsTitle').focus(),0);
  $('fsTitle').oninput=()=>$('fsDirty').classList.add('show');
  $('fsBody').oninput=()=>$('fsDirty').classList.add('show');
  $('fsSave').onclick=()=>{
    const n=data.notes.find(x=>x.id===fsNoteId); if(!n)return;
    n.title=$('fsTitle').value; n.body=$('fsBody').value; n.updated=Date.now();
    $('fsDirty').classList.remove('show'); $('fsMeta').textContent='Updated '+new Date(n.updated).toLocaleString();
    save();
  };
  $('fsClose').onclick=()=>{$('fsNote').classList.remove('show');fsNoteId=null;renderNotes()};
}
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&$('fsNote').classList.contains('show')){$('fsNote').classList.remove('show');fsNoteId=null;renderNotes()}});

/* ---------- HOME / TASKS / CALENDAR ---------- */
function renderStats(){$('statSubjects').textContent=data.subjects.length;$('statNotes').textContent=data.notes.length;$('statTasks').textContent=data.tasks.filter(t=>!t.done).length}

function renderCalendar(){
  const y=calDate.getFullYear(), m=calDate.getMonth();
  $('monthLabel').textContent = calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const first=new Date(y,m,1), start=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate();
  let out=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('');
  for(let i=0;i<42;i++){
    let d=i-start+1, dt=new Date(y,m,d);
    let iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    let num = d<1 ? prev+d : d>days ? d-days : d;
    
    const dayTasks = data.tasks.filter(t => t.date===iso);
    const hasOpen = dayTasks.some(t => !t.done);
    const hasDone = dayTasks.length && !hasOpen;
    const lessons = getLessonsForDate(iso);
    
    let cls = 'day';
    if(d<1||d>days) cls+=' other';
    if(iso===todayISO()) cls+=' today';
    if(selectedDate && iso===selectedDate) cls+=' selected';
    if(hasOpen) cls+=' has-task';
    if(hasDone) cls+=' has-done';
    if(lessons.length) cls+=' has-lessons';
    
    out+=`<button class="${cls}" data-date="${iso}">${num}</button>`;
  }
  $('calendar').innerHTML=out;
  document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{
    selectedDate=b.dataset.date;
    renderCalendar();
    showView('planner');
    renderTasks();
  });
}
$('prevMonth').onclick=()=>{calDate.setMonth(calDate.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{calDate.setMonth(calDate.getMonth()+1);renderCalendar()};
function taskHTML(t){return `<div class="task ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div class="task-text">${esc(t.text)}<small>${t.date?new Date(t.date+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'No due date'}</small></div><button class="delete" data-delete="${t.id}" aria-label="Delete task">×</button></div>`}
function wireTasks(){document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let t=data.tasks.find(x=>x.id===c.dataset.check);if(t)t.done=c.checked;save()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!==b.dataset.delete);save()})}

function renderTasks(){
  const all=[...data.tasks];
  const forDay=all.filter(t=>t.date===selectedDate).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  const others=all.filter(t=>t.date!==selectedDate).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  
  let html='';
  const lessons = getLessonsForDate(selectedDate);
  const dateObj = new Date(selectedDate+'T12:00:00');
  
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h3 style="font-size:15px;margin:0">${dateObj.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</h3>
    <button class="btn small" id="clearDateFilter">Show all</button>
  </div>`;

  if(lessons.length) {
    html += `<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px">Timetable (${getWeekNumber(selectedDate)===1?'Week 1':'Week 2'})</h4>`;
    html += `<div class="timetable">`;
    lessons.forEach(l => {
      html += `<div class="lesson-row">
        <div class="lesson-info">
          <strong>P${l.p}: ${esc(l.s)}</strong>
          <span>${l.r ? l.r + ' · ' : ''}${l.t}</span>
        </div>
        <div class="lesson-actions">
          <button data-add-lesson-task="${l.p}" data-subject="${l.s}">＋ Deadline</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html+=`<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px">Tasks for this day</h4>`;
  html+=forDay.length?forDay.map(taskHTML).join(''):'<div class="empty" style="padding:10px">No tasks on this date.</div>';
  
  if(others.length){
    html+=`<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 8px">All other tasks</h4>`;
    html+=others.map(taskHTML).join('');
  }
  
  $('allTasks').innerHTML=html;
  wireTasks();
  
  $('clearDateFilter').onclick=()=>{selectedDate='';renderCalendar();renderTasks()};
  
  // wire lesson deadline buttons
  document.querySelectorAll('[data-add-lesson-task]').forEach(b=>b.onclick=()=>{
    const subjName = b.dataset.subject;
    const period = b.dataset.addLessonTask;
    openModal('Add deadline', `
      <label class="field-label">Task</label>
      <input class="field" id="taskText" placeholder="e.g. Finish essay">
      <label class="field-label">Date</label>
      <input class="field" type="date" id="taskDate" value="${selectedDate}" readonly>
      <input type="hidden" id="taskSubject" value="${subjName}">
      <input type="hidden" id="taskPeriod" value="${period}">
    `, ()=>{
      let v=$('taskText').value.trim();
      if(v) {
        data.tasks.push({
          id:uid(),
          text:v,
          date:$('taskDate').value,
          done:false,
          subject: $('taskSubject').value,
          period: $('taskPeriod').value
        });
        save();
      }
    });
  });
}

function renderHome(){
  const upcoming=data.tasks
    .filter(t=>!t.done&&t.date&&t.date>=todayISO())
    .sort((a,b)=>a.date.localeCompare(b.date))
    .slice(0,3);

  $('todayTasks').innerHTML=upcoming.length
    ? upcoming.map(taskHTML).join('')
    : '<div class="empty">No upcoming tasks. Enjoy the breathing room.</div>';
  wireTasks();

  let recent=[...data.notes].sort((a,b)=>b.updated-a.updated).slice(0,4);
  $('recentNotes').innerHTML=recent.length
    ? recent.map(n=>`<div class="task"><div class="task-text"><b>${esc(n.title||'Untitled note')}</b><small>${esc(data.subjects.find(s=>s.id===n.subject)?.name||'Subject')} · ${new Date(n.updated).toLocaleDateString()}</small></div><button class="delete" data-open="${n.id}">Open</button></div>`).join('')
    : '<div class="empty">Your notes will appear here.</div>';

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    let n=data.notes.find(x=>x.id===b.dataset.open);
    currentSubject=n.subject;currentPath=[...n.path];currentNote=n.id;dirty=false;
    showView('notes');renderAll();
  });
}

$('addSubject').onclick=()=>openModal('Add a subject',`<label class="field-label">Subject name</label><input class="field" id="subjectName" placeholder="e.g. Psychology">`,()=>{let v=$('subjectName').value.trim();if(v){let s={id:uid(),name:v,color:['#e2a34b','#7c83df','#49a88d','#d77c9b','#5c9bc4'][data.subjects.length%5],topics:[]};data.subjects.push(s);currentSubject=s.id;currentPath=[];currentNote=null;save()}});

$('addTask').onclick=addTask;$('quickTask').onclick=addTask;

$('quickNote').onclick=(e)=>{
  e.stopPropagation();
  const menu=$('quickNoteMenu');
  menu.innerHTML=data.subjects.map(s=>`<button data-qsub="${s.id}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:6px"></span>${esc(s.name)}</button>`).join('')||'<div style="padding:10px 14px" class="muted">No subjects yet</div>';
  menu.classList.toggle('show');
  menu.querySelectorAll('[data-qsub]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    menu.classList.remove('show');
    currentSubject=b.dataset.qsub;currentPath=[];currentNote=null;dirty=false;
    showView('notes');
    const s=data.subjects.find(x=>x.id===currentSubject);
    if(s&&s.topics.length){currentPath=[s.topics[0].id];expanded.add(s.topics[0].id)}
    renderAll();
    setTimeout(()=>{ if(currentPath.length) addNoteHere(); else alert('Add a topic first (＋ Add → New topic).'); },0);
  });
};
document.addEventListener('click',(e)=>{ if(!e.target.closest('#quickNote') && !e.target.closest('#quickNoteMenu')) $('quickNoteMenu').classList.remove('show'); });

/* ---------- SETTINGS & TERM DATES ---------- */
$('termDatesBtn').onclick = () => {
  openModal('Term Dates', `
    <p class="muted" style="font-size:13px;margin-top:0">Enter the start date of a Week 2 Monday. The app will automatically alternate Weeks 1 & 2 from this date forward.</p>
    <label class="field-label">Week 2 Start Date (Monday)</label>
    <input class="field" type="date" id="week2Date" value="${data.settings.week2Start}">
    <p class="muted" style="font-size:11px;margin-top:12px">Note: Holidays are not automatically removed from the timetable. If you are on half-term, the calendar will still show lessons. (To fix this, manually adjust the Week 2 Start Date after every holiday!)</p>
  `, () => {
    const v = $('week2Date').value;
    if(v) {
      data.settings.week2Start = v;
      save();
    }
  });
};

/* ---------- IMPORT / EXPORT ---------- */
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studyspace-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(Array.isArray(d.subjects)&&Array.isArray(d.notes)&&Array.isArray(d.tasks)){data=d;if(!data.settings)data.settings={week2Start:nextMondayISO()};currentSubject=data.subjects[0]?.id||null;currentPath=[];currentNote=null;save()}else alert('That backup file does not look valid.')}catch{alert('Could not read that backup file.')}e.target.value=''};

$('syncPanelBtn').onclick=()=>openModal('Sync & settings','<p class="muted" style="font-size:13px">Online sync (offline + JSON backup) is coming in the next version. For now, use Export / Import backup to move data between devices.</p>',null);

function renderAll(){renderSidebarTree();renderStats();renderCalendar();renderHome();if($('notesView').classList.contains('active'))renderNotes();if($('plannerView').classList.contains('active'))renderTasks()}
renderAll();
</script>
</body>
</html>
